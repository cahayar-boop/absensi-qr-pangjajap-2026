
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pangjajap 2026 - QR Attendance</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      color: #183b2b;
    }

    .container {
      max-width: 460px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 20px #0001;
    }

    h1 { text-align: center; font-size: 24px; }
    .subtitle {
      text-align: center;
      color: #718078;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd6cf;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 9px;
      background: #176b45;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button.secondary { background: #53665b; }
    button.danger { background: #a33b3b; }

    #reader { width: 100%; margin-top: 20px; }

    #hasil {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f4f2;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }

    .small {
      color: #718078;
      font-size: 12px;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>PANGJAJAP 2026</h1>
    <p class="subtitle">QR ATTENDANCE SYSTEM</p>

    <section id="loginSection">
      <h3>Login Panitia</h3>

      <label for="email">Email</label>
      <input id="email" type="email"
        placeholder="Email akun panitia">

      <label for="password">Password</label>
      <input id="password" type="password"
        placeholder="Password akun panitia">

      <button id="loginBtn" onclick="login()">
        LOGIN
      </button>
    </section>

    <section id="scannerSection" class="hidden">
      <p id="userInfo"></p>

      <label for="eventId">ID Acara</label>
      <input id="eventId" value="PJP2026">

      <button onclick="mulaiScanner()">
        BUKA KAMERA & MULAI SCAN
      </button>

      <button class="danger" onclick="tutupScanner()">
        TUTUP KAMERA
      </button>

      <div id="reader"></div>
      <div id="hasil">Scanner belum aktif.</div>

      <button class="secondary" onclick="logout()">
        LOGOUT
      </button>
    </section>

    <p class="small">
      Sistem Absensi Pangjajap 2026
    </p>
  </main>

<script>
const SUPABASE_URL =
  "https://wxyyrcvhboedayyypiiw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Q60mror9LagDQsghStIh2A_uOH-miFF";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let scanner = null;
let scannerAktif = false;
let sedangMemproses = false;

const loginSection =
  document.getElementById("loginSection");

const scannerSection =
  document.getElementById("scannerSection");

const hasil =
  document.getElementById("hasil");

function tampil(pesan) {
  hasil.textContent = pesan;
}

function tampilIdentitas(user) {
  loginSection.classList.add("hidden");
  scannerSection.classList.remove("hidden");

  document.getElementById("userInfo").textContent =
    "Login sebagai: " + user.email;
}

async function login() {
  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    alert("Email dan password harus diisi.");
    return;
  }

  const tombol = document.getElementById("loginBtn");
  tombol.disabled = true;
  tombol.textContent = "MEMPROSES...";

  const { data, error } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  tombol.disabled = false;
  tombol.textContent = "LOGIN";

  if (error) {
    alert("Login gagal: " + error.message);
    return;
  }

  tampilIdentitas(data.user);
  tampil("Login berhasil. Scanner siap digunakan.");
}

async function logout() {
  await tutupScanner();

  const { error } = await db.auth.signOut();

  if (error) {
    alert("Logout gagal: " + error.message);
    return;
  }

  scannerSection.classList.add("hidden");
  loginSection.classList.remove("hidden");
  tampil("Silakan login kembali.");
}

async function cekLogin() {
  const { data } = await db.auth.getSession();

  if (data.session) {
    tampilIdentitas(data.session.user);
    tampil("Login terdeteksi. Scanner siap digunakan.");
  }
}

async function mulaiScanner() {
  if (scannerAktif) return;

  const eventId =
    document.getElementById("eventId").value.trim();

  if (!eventId) {
    tampil("ID acara harus diisi.");
    return;
  }

  scanner = new Html5Qrcode("reader");
  scannerAktif = true;

  tampil("Meminta akses kamera...");

  try {
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      async (kodeQR) => {
        if (sedangMemproses) return;

        sedangMemproses = true;
        scanner.pause(true);

        await kirimAbsensi(kodeQR);
      },
      () => {}
    );

    tampil("Kamera aktif. Arahkan ke QR mahasiswa.");

  } catch (error) {
    scannerAktif = false;
    scanner = null;
    tampil("Kamera gagal dibuka: " + error);
  }
}

async function kirimAbsensi(kodeQR) {
  const eventId =
    document.getElementById("eventId").value.trim();

  tampil("QR terbaca. Memeriksa database...");

  try {
    const { data, error } = await db.rpc(
      "scan_absensi",
      {
        p_kode_qr: kodeQR,
        p_id_acara: eventId
      }
    );

    if (error) {
      throw error;
    }

    if (data.status === "success") {
      tampil(
        "BERHASIL HADIR\n" +
        "Nama: " + data.nama + "\n" +
        "NPM: " + data.npm + "\n" +
        "Prodi: " + data.prodi + "\n" +
        data.message
      );

    } else if (data.status === "duplicate") {
      tampil(
        "SUDAH ABSEN\n" +
        "Nama: " + data.nama + "\n" +
        "NPM: " + data.npm + "\n" +
        data.message
      );

    } else {
      tampil("GAGAL\n" + data.message);
    }

  } catch (error) {
    tampil("GAGAL MENGHUBUNGI DATABASE\n" + error.message);

  } finally {
    setTimeout(() => {
      sedangMemproses = false;

      if (scanner && scannerAktif) {
        scanner.resume();
      }
    }, 1800);
  }
}

async function tutupScanner() {
  if (!scanner || !scannerAktif) return;

  try {
    await scanner.stop();
    scanner.clear();
  } catch (error) {
    console.error(error);
  }

  scanner = null;
  scannerAktif = false;
  sedangMemproses = false;

  tampil("Kamera ditutup.");
}

cekLogin();
</script>
</body>
</html>
