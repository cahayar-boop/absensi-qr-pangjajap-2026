
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi Pangjajap 2026</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      color: #183b2b;
    }

    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0001;
    }

    h1 { text-align: center; font-size: 23px; }
    .subtitle {
      text-align: center;
      color: #718078;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd6cf;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 13px;
      border: none;
      border-radius: 9px;
      background: #176b45;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary { background: #53665b; }
    button:disabled { opacity: .6; }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #hasil {
      white-space: pre-line;
      overflow-wrap: anywhere;
      margin-top: 18px;
      padding: 16px;
      border-radius: 10px;
      background: #f1f4f2;
      line-height: 1.6;
      text-align: center;
    }

    .small {
      font-size: 12px;
      text-align: center;
      color: #718078;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>PANGJAJAP 2026</h1>
    <p class="subtitle">QR ATTENDANCE SYSTEM</p>

    <label for="eventId">ID Acara</label>
    <input id="eventId" value="PJP2026">

    <button id="startBtn" onclick="mulaiScanner()">
      MULAI SCAN ABSENSI
    </button>

    <button class="secondary" onclick="tutupScanner()">
      TUTUP KAMERA
    </button>

    <div id="reader"></div>
    <div id="hasil">Scanner siap digunakan.</div>

    <p class="small">
      Sistem Absensi Pangjajap 2026
    </p>
  </main>

<script>
const SUPABASE_URL =
  "https://wxyyrcvhboedayyypiiw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Q60mror9LagDQsghStIh2A_uOH-miFF";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let scanner = null;
let scannerAktif = false;
let sedangMemproses = false;

const hasil = document.getElementById("hasil");
const startBtn = document.getElementById("startBtn");

function tampil(pesan) {
  hasil.textContent = pesan;
}

async function mulaiScanner() {
  if (scannerAktif) return;

  const eventId =
    document.getElementById("eventId").value.trim();

  if (!eventId) {
    tampil("ID acara harus diisi.");
    return;
  }

  scanner = new Html5Qrcode("reader");
  scannerAktif = true;
  startBtn.disabled = true;

  tampil("Mengaktifkan kamera...");

  try {
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      async (kodeQR) => {
        if (sedangMemproses) return;

        sedangMemproses = true;
        scanner.pause(true);

        await kirimAbsensi(kodeQR);
      },
      () => {}
    );

    tampil("KAMERA AKTIF\nArahkan kamera ke QR mahasiswa.");

  } catch (error) {
    scannerAktif = false;
    scanner = null;
    startBtn.disabled = false;

    tampil("KAMERA GAGAL DIBUKA\n" + error.message);
  }
}

async function kirimAbsensi(kodeQR) {
  const eventId =
    document.getElementById("eventId").value.trim();

  tampil("QR TERBACA\nMemeriksa database...");

  try {
    const { data, error } = await db.rpc(
      "scan_absensi",
      {
        p_kode_qr: kodeQR,
        p_id_acara: eventId
      }
    );

    if (error) throw error;

    if (data.status === "success") {
      tampil(
        "✓ ABSENSI BERHASIL\n\n" +
        "Nama: " + data.nama + "\n" +
        "NPM: " + data.npm + "\n" +
        "Prodi: " + data.prodi + "\n\n" +
        data.message
      );

    } else if (data.status === "duplicate") {
      tampil(
        "⚠ SUDAH ABSEN\n\n" +
        "Nama: " + data.nama + "\n" +
        "NPM: " + data.npm + "\n" +
        "Prodi: " + data.prodi + "\n\n" +
        data.message
      );

    } else {
      tampil(
        "✕ ABSENSI GAGAL\n\n" + data.message
      );
    }

  } catch (error) {
    tampil(
      "✕ KONEKSI DATABASE GAGAL\n\n" +
      error.message
    );

  } finally {
    setTimeout(() => {
      sedangMemproses = false;

      if (scanner && scannerAktif) {
        scanner.resume();
      }
    }, 1800);
  }
}

async function tutupScanner() {
  if (!scanner || !scannerAktif) return;

  try {
    await scanner.stop();
    scanner.clear();
  } catch (error) {
    console.error(error);
  }

  scanner = null;
  scannerAktif = false;
  sedangMemproses = false;
  startBtn.disabled = false;

  tampil("Kamera sudah ditutup.");
}
</script>
</body>
</html>
