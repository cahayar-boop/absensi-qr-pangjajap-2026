
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PANGJAJAP 2026 - QR Attendance</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #183b2b;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { text-align: center; font-size: 24px; }
    .sub { text-align: center; color: #68756d; margin-bottom: 24px; }
    label { display: block; font-weight: bold; margin: 15px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd6cf;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 9px;
      background: #176b45;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    button.stop { background: #a33b3b; }
    #reader { margin-top: 20px; width: 100%; }
    #hasil {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #f1f4f2;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .note { color: #68756d; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>PANGJAJAP 2026</h1>
    <p class="sub">QR ATTENDANCE SYSTEM</p>

    <label for="eventId">ID Acara</label>
    <input id="eventId" value="PJP2026">

    <label for="token">Token Panitia</label>
    <input id="token" type="password" placeholder="Masukkan token panitia">

    <button id="startBtn" onclick="mulaiScanner()">BUKA KAMERA & MULAI SCAN</button>
    <button class="stop" onclick="tutupScanner()">TUTUP KAMERA</button>

    <div id="reader"></div>
    <div id="hasil">Scanner belum aktif.</div>
    <p class="note">
      Gunakan hanya untuk panitia Pangjajap 2026.
      Jangan membagikan token panitia kepada orang lain.
    </p>
  </main>

<script>
const API_URL =
  "https://script.google.com/a/macros/student.unsil.ac.id/s/AKfycbwZUSslGqg8Lta0H7wJ6-EK0tWxs_YHzVn173kE_CYa9PObnmQzFDLNAGQ4OSShuAKEsw/exec";

let scanner = null;
let sedangMemproses = false;
let scannerAktif = false;

function tampil(pesan) {
  document.getElementById("hasil").innerHTML = pesan;
}

function mulaiScanner() {
  const eventId = document.getElementById("eventId").value.trim();
  const token = document.getElementById("token").value.trim();

  if (!eventId || !token) {
    tampil("Isi ID acara dan token panitia terlebih dahulu.");
    return;
  }

  if (scannerAktif) return;

  scanner = new Html5Qrcode("reader");
  scannerAktif = true;
  tampil("Meminta akses kamera...");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    kodeQR => {
      if (sedangMemproses) return;
      sedangMemproses = true;
      kirimAbsensi(kodeQR);
    },
    () => {}
  ).then(() => {
    tampil("Kamera aktif. Arahkan ke QR mahasiswa.");
  }).catch(error => {
    scannerAktif = false;
    tampil("Kamera gagal dibuka: " + error);
  });
}

function kirimAbsensi(kodeQR) {
  const eventId = document.getElementById("eventId").value.trim();
  const token = document.getElementById("token").value.trim();
  const callbackName = "absensiCallback_" + Date.now();

  tampil("QR terbaca. Memeriksa data mahasiswa...");

  const params = new URLSearchParams({
    action: "scan",
    kodeQR: kodeQR,
    idAcara: eventId,
    token: token,
    callback: callbackName
  });

  const script = document.createElement("script");
  let selesai = false;

  function bersihkan() {
    selesai = true;
    delete window[callbackName];
    script.remove();
    clearTimeout(batasWaktu);
    sedangMemproses = false;
  }

  window[callbackName] = function(data) {
    bersihkan();

    if (data.status === "success") {
      tampil(
        "<strong>BERHASIL HADIR</strong><br>" +
        "Nama: " + aman(data.nama) + "<br>" +
        "NPM: " + aman(data.npm) + "<br>" +
        "Prodi: " + aman(data.prodi) + "<br>" +
        aman(data.message)
      );
    } else if (data.status === "duplicate") {
      tampil(
        "<strong>SUDAH ABSEN</strong><br>" +
        "Nama: " + aman(data.nama) + "<br>" +
        "NPM: " + aman(data.npm) + "<br>" +
        aman(data.message)
      );
    } else {
      tampil("<strong>GAGAL</strong><br>" + aman(data.message));
    }
  };

  const batasWaktu = setTimeout(() => {
    if (!selesai) {
      bersihkan();
      tampil("Waktu permintaan habis. Periksa koneksi dan Apps Script.");
    }
  }, 15000);

  script.onerror = function() {
    if (!selesai) {
      bersihkan();
      tampil("Gagal menghubungi server absensi.");
    }
  };

  script.src = API_URL + "?" + params.toString();
  document.body.appendChild(script);
}

function aman(teks) {
  return String(teks ?? "").replace(/[&<>"']/g, karakter => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[karakter]);
}

function tutupScanner() {
  if (scanner && scannerAktif) {
    scanner.stop().then(() => {
      scanner.clear();
      scanner = null;
      scannerAktif = false;
      sedangMemproses = false;
      tampil("Kamera ditutup.");
    }).catch(error => {
      tampil("Gagal menutup kamera: " + error);
    });
  }
}
</script>
</body>
</html>
